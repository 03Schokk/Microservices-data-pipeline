server {
    listen 443 ssl;
    server_name lab1-nginx;

    # сертификат сервера lab1-nginx
    ssl_certificate /etc/nginx/certs/server.crt;

    # ключ сервера lab1-nginx
    ssl_certificate_key /etc/nginx/certs/server.key;

    # корневой сертификат CA, которым подписан клиентский сертификат gateway
    # (nginx будет доверять только клиентам, предъявившим сертификат, подписанный этим CA)
    ssl_client_certificate /etc/nginx/certs/ca.crt;

    # требование от клиента предъявить сертификат
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # все запросы в /lab1/ проксируются на lab1_service:8001 по HTTP
    # (внутри сети Docker, без дополнительного шифрования, т.к. сеть изолирована)
    location /lab1/ {
        proxy_pass http://lab1_service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для длительных операций
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;  # 10 минут, генерация может быть долгой
    }

    location /lab2/ {
        proxy_pass http://lab2_service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличиваем таймауты для длительных операций
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;  # 10 минут, генерация может быть долгой
    }

    # Lab3 service
    location /lab3/ {
        proxy_pass http://lab3_service:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличиваем таймауты для длительных операций
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;  # 10 минут, генерация может быть долгой
    }
}