server {
    listen 443 ssl;
    server_name lab1-nginx;

    # сертификат сервера lab1-nginx
    ssl_certificate /etc/nginx/certs/server.crt;

    # ключ сервера lab1-nginx
    ssl_certificate_key /etc/nginx/certs/server.key;

    # корневой сертификат CA, которым подписан клиентский сертификат gateway
    # (nginx будет доверять только клиентам, предъявившим сертификат, подписанный этим CA)
    ssl_client_certificate /etc/nginx/certs/ca.crt;

    # требование от клиента предъявить сертификат
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # все запросы проксируются на lab1_service:8001 по HTTP
    # (внутри сети Docker, без дополнительного шифрования, т.к. сеть изолирована)
    location / {
        proxy_pass http://lab1_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}