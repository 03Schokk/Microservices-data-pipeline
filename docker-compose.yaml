services:
  # -------------------- Базы данных --------------------
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    command: redis-server --appendonly yes --logfile /var/log/redis/redis.log
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb-server
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_logs:/var/log/mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: testdb
    networks:
      - data-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neo4j-server
    restart: unless-stopped
    ports:
      - "10000:7474"
      - "10001:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: elasticsearch-server
    restart: unless-stopped
    ports:
      - "12000:9200"
      - "12001:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_logs:/usr/share/elasticsearch/logs
    environment:
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - discovery.type=single-node
      - ELASTIC_PASSWORD=elastic_pass123
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:15-alpine
    container_name: postgresql-server
    restart: unless-stopped
    ports:
      - "5435:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - postgresql_logs:/var/log/postgresql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: testdb
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres -c listen_addresses='*' -c log_directory='/var/log/postgresql' -c max_connections=200
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- Генератор сертификатов --------------------
  # запускается один раз, генерирует сертификаты, вырубается, после чего сертификаты используются в других контейнерах
  cert-generator:
    image: alpine:latest
    container_name: cert-generator
    volumes:
      - certs_data:/certs
      - ./scripts/generate-all-certs.sh:/generate-all-certs.sh:ro
    command: sh -c "apk add --no-cache openssl && sh /generate-all-certs.sh"
    networks:
      - data-network

  # -------------------- API Gateway --------------------
  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - certs_data:/certs:ro
    networks:
      - data-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      nginx:
        condition: service_started

  # -------------------- Lab Service --------------------
  # Nginx с mTLS
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/nginx/certs:ro
    networks:
      - data-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      lab1_service:
        condition: service_started
      lab2_service:
        condition: service_started
      lab3_service:
        condition: service_started

  lab1_service:
    build:
      context: .
      dockerfile: ./lab1_service/dockerfile
    container_name: lab1-service
    restart: unless-stopped
    expose:
      - "8001" # порты наружу можно не пробрасывать, только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  lab2_service:
    build:
      context: .
      dockerfile: ./lab2_service/dockerfile
    container_name: lab2-service
    restart: unless-stopped
    expose:
      - "8002" # порты наружу можно не пробрасывать, только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  lab3_service:
    build:
      context: .
      dockerfile: ./lab3_service/dockerfile
    container_name: lab3-service
    restart: unless-stopped
    expose:
      - "8003" # порты наружу можно не пробрасывать, только внутренняя сеть
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=testdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=admin
      - MONGO_PASSWORD=admin123
      - MONGO_DB=testdb
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic_pass123
    networks:
      - data-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

networks:
  data-network:
    driver: bridge

volumes:
  certs_data:
    driver: local
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/redis
      o: bind
  redis_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/logs/redis
      o: bind
  mongodb_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/mongodb
      o: bind
  mongodb_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/logs/mongodb
      o: bind
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/neo4j/data
      o: bind
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/neo4j/logs
      o: bind
  neo4j_import:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/neo4j/import
      o: bind
  neo4j_plugins:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/neo4j/plugins
      o: bind
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/elasticsearch/data
      o: bind
  elasticsearch_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/logs/elasticsearch
      o: bind
  postgresql_data:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/postgresql/data
      o: bind
  postgresql_logs:
    driver: local
    driver_opts:
      type: none
      device: D:/Docker/Containers/database/logs/postgresql
      o: bind